<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TinyML Audio Classifier</title>
<style>
  :root { --bg: #1a1e29; --card: #2a3040; --text: #f0f2f5; --primary: #3b82f6; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); padding-bottom: 60px; }
  header { text-align: center; padding: 2rem 1rem 1rem; }
  header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
  header p { color: #9ca3af; font-size: 1.1rem; }
  .container { max-width: 800px; margin: 0 auto; padding: 0 1rem; display: flex; flex-direction: column; gap: 1rem; }
  @media(min-width: 600px) { .row { flex-direction: row; } }
  .row { display: flex; gap: 1rem; flex-direction: column; }
  .card { background: var(--card); border-radius: 12px; padding: 1.5rem; flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: transform 0.2s; }
  .card h2 { margin-bottom: 1rem; font-size: 1.25rem; }
  .btn { background: var(--primary); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; width: 100%; margin-top: 1rem; font-size: 1rem; }
  .btn:hover { background: #2563eb; }
  .btn:disabled { background: #4b5563; cursor: not-allowed; }
  .btn.danger { background: var(--danger); }
  .btn.danger:hover { background: #dc2626; }
  .drop-zone { border: 2px dashed #4b5563; border-radius: 8px; padding: 2rem 1rem; width: 100%; cursor: pointer; transition: border-color 0.2s, background 0.2s; margin-bottom: 1rem; }
  .drop-zone.dragover { border-color: var(--primary); background: rgba(59, 130, 246, 0.1); }
  .file-input { display: none; }
  .toggle-group { display: flex; gap: 0.5rem; margin-bottom: 1rem; width: 100%; }
  .toggle-btn { flex: 1; padding: 0.5rem; border: 1px solid #4b5563; background: transparent; color: var(--text); border-radius: 6px; cursor: pointer; }
  .toggle-btn.active { background: var(--primary); border-color: var(--primary); }
  
  .recording-indicator { width: 16px; height: 16px; background: var(--danger); border-radius: 50%; margin: 1rem auto; animation: pulse 1s infinite; display: none; }
  .recording-indicator.active { display: block; }
  @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
  .meter { width: 100%; height: 10px; background: #374151; border-radius: 5px; overflow: hidden; margin-bottom: 1rem; }
  .meter-bar { height: 100%; width: 0%; background: var(--success); transition: width 0.1s; }
  
  .canvas-container { width: 100%; background: #111827; border-radius: 8px; padding: 1rem; margin-top: 1rem; }
  canvas { width: 100%; height: 80px; }

  .results { display: none; margin-top: 2rem; background: var(--card); border-radius: 12px; padding: 2rem; text-align: center; }
  .results.active { display: block; animation: slideUp 0.3s ease-out; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 1rem; display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .emoji { font-size: 4rem; margin-bottom: 0.5rem; }
  .class-name { font-size: 2rem; font-weight: bold; margin-bottom: 0.5rem; text-transform: capitalize; }
  .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.875rem; font-weight: 600; margin-bottom: 1.5rem; }
  .badge.animals { background: rgba(16, 185, 129, 0.2); color: var(--success); }
  .badge.nature { background: rgba(59, 130, 246, 0.2); color: var(--primary); }
  .badge.human { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
  .conf-bar-container { width: 100%; background: #374151; border-radius: 8px; height: 16px; margin: 1rem 0; overflow: hidden; position: relative; }
  .conf-bar { height: 100%; border-radius: 8px; transition: width 0.5s ease-out, background 0.3s; }
  .conf-text { position: absolute; top: 0; left: 0; width: 100%; text-align: center; font-size: 0.75rem; line-height: 16px; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
  .predictions { text-align: left; margin-top: 1.5rem; }
  .pred-row { display: flex; align-items: center; margin-bottom: 0.5rem; font-size: 0.9rem; }
  .pred-name { width: 100px; text-transform: capitalize; }
  .pred-bar-bg { flex: 1; background: #374151; height: 8px; border-radius: 4px; margin: 0 1rem; overflow: hidden; }
  .pred-bar { height: 100%; background: var(--primary); }
  .pred-val { width: 40px; text-align: right; }
  .metrics { display: flex; justify-content: center; gap: 2rem; margin-top: 1.5rem; color: #9ca3af; font-size: 0.875rem; }
  
  .status-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #111827; padding: 0.75rem 1rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.875rem; border-top: 1px solid #374151; z-index: 10; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 0.5rem; }
  .status-dot.connected { background: var(--success); }
  .status-dot.disconnected { background: var(--danger); }
  .status-info { display: flex; gap: 1rem; color: #9ca3af; }

  .toast { position: fixed; top: 1rem; right: 1rem; background: var(--card); border-left: 4px solid var(--danger); padding: 1rem 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 50; transition: opacity 0.3s, transform 0.3s; opacity: 0; transform: translateX(100%); }
  .toast.show { opacity: 1; transform: translateX(0); }
</style>
</head>
<body>

<header>
  <h1>🎵 TinyML Audio Classifier</h1>
  <p>Arduino Nano ESP32</p>
</header>

<div class="container">
  <div class="row">
    <div class="card" id="uploadCard">
      <h2>📁 Upload Audio</h2>
      <div class="drop-zone" id="dropZone">
        <p>Drag & drop .wav file here<br>or click to select</p>
        <input type="file" id="fileInput" class="file-input" accept=".wav">
      </div>
      <p id="fileName" style="margin-bottom:1rem; font-size:0.9rem; color:#9ca3af;"></p>
      <button class="btn" id="btnClassifyUpload" disabled>Classify File</button>
    </div>

    <div class="card" id="recordCard">
      <h2>🎤 Record Audio</h2>
      <div class="toggle-group" id="durationToggle">
        <button class="toggle-btn" data-dur="3">3s</button>
        <button class="toggle-btn active" data-dur="5">5s</button>
        <button class="toggle-btn" data-dur="10">10s</button>
      </div>
      <div class="recording-indicator" id="recIndicator"></div>
      <div class="meter"><div class="meter-bar" id="recMeter"></div></div>
      <button class="btn" id="btnRecord">Start Recording</button>
      <button class="btn" id="btnClassifyRecord" disabled style="display:none;">Classify Recording</button>
    </div>
  </div>

  <div class="canvas-container">
    <h3 style="font-size:0.9rem; color:#9ca3af; margin-bottom:0.5rem; text-align:center;">Audio Waveform</h3>
    <canvas id="waveform"></canvas>
  </div>

  <div class="results" id="resultsBox">
    <div class="spinner" id="spinner"></div>
    <div id="resultContent" style="display:none;">
      <div class="emoji" id="resEmoji">❓</div>
      <div class="class-name" id="resClass">Unknown</div>
      <div class="badge animals" id="resBadge">Category</div>
      <div class="conf-bar-container">
        <div class="conf-bar" id="resConfBar" style="width: 0%; background: var(--success);"></div>
        <div class="conf-text" id="resConfText">0%</div>
      </div>
      <div class="predictions" id="resTop5"></div>
      <div class="metrics">
        <span id="resInfTime">⏱️ Inf: -- ms</span>
        <span id="resPrepTime">⚙️ Prep: -- ms</span>
      </div>
    </div>
  </div>
</div>

<div class="status-bar">
  <div><span class="status-dot disconnected" id="connDot"></span> <span id="connText">Disconnected</span></div>
  <div class="status-info">
    <span id="statHeap">Heap: -- KB</span>
    <span id="statUptime">Uptime: --</span>
  </div>
</div>

<div class="toast" id="toast">Error message</div>

<script>
// --- Config & Mapping ---
const TARGET_SAMPLE_RATE = 16000;
const emojiMap = {
  dog: '🐕', cat: '🐱', cow: '🐄', frog: '🐸', rooster: '🐓', pig: '🐷', sheep: '🐑', crow: '🦅',
  rain: '🌧️', sea_waves: '🌊', crackling_fire: '🔥', wind: '💨', thunderstorm: '⛈️', pouring_water: '💧',
  clapping: '👏', breathing: '😤', coughing: '🤧', footsteps: '👣', laughing: '😂', snoring: '😴', sneezing: '🤧'
};
const categoryMap = {
  dog: 'animals', cat: 'animals', cow: 'animals', frog: 'animals', rooster: 'animals', pig: 'animals', sheep: 'animals', crow: 'animals',
  rain: 'nature', sea_waves: 'nature', crackling_fire: 'nature', wind: 'nature', thunderstorm: 'nature', pouring_water: 'nature',
  clapping: 'human', breathing: 'human', coughing: 'human', footsteps: 'human', laughing: 'human', snoring: 'human', sneezing: 'human'
};

let currentAudioPCM = null; 
let audioContext = null;

// --- UI Elements ---
const elDropZone = document.getElementById('dropZone');
const elFileInput = document.getElementById('fileInput');
const elFileName = document.getElementById('fileName');
const elBtnClassifyUpload = document.getElementById('btnClassifyUpload');
const elBtnRecord = document.getElementById('btnRecord');
const elBtnClassifyRecord = document.getElementById('btnClassifyRecord');
const elRecIndicator = document.getElementById('recIndicator');
const elRecMeter = document.getElementById('recMeter');
const elDurationBtns = document.querySelectorAll('.toggle-btn');
const canvas = document.getElementById('waveform');
const ctx = canvas.getContext('2d');
const elResultsBox = document.getElementById('resultsBox');
const elSpinner = document.getElementById('spinner');
const elResultContent = document.getElementById('resultContent');

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// --- Audio Processing Utils ---
function floatTo16BitPCM(input) {
  const output = new Int16Array(input.length);
  for (let i = 0; i < input.length; i++) {
    const s = Math.max(-1, Math.min(1, input[i]));
    output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  return output;
}

function drawWaveform(pcmData) {
  const width = canvas.width;
  const height = canvas.height;
  ctx.fillStyle = '#111827';
  ctx.fillRect(0, 0, width, height);
  if (!pcmData || pcmData.length === 0) return;
  
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#3b82f6';
  ctx.beginPath();
  
  const step = Math.ceil(pcmData.length / width);
  for (let i = 0; i < width; i++) {
    let min = 1.0, max = -1.0;
    for (let j = 0; j < step; j++) {
      const idx = i * step + j;
      if (idx < pcmData.length) {
        const val = pcmData[idx] / 32768.0;
        if (val < min) min = val;
        if (val > max) max = val;
      }
    }
    const yMax = (1 - max) * height / 2;
    const yMin = (1 - min) * height / 2;
    if (i === 0) ctx.moveTo(i, yMax);
    else { ctx.lineTo(i, yMax); ctx.lineTo(i, yMin); }
  }
  ctx.stroke();
}

async function resampleAudio(audioBuffer, targetDurationSec) {
  const actualDuration = Math.min(audioBuffer.duration, targetDurationSec);
  const offlineCtx = new OfflineAudioContext(1, actualDuration * TARGET_SAMPLE_RATE, TARGET_SAMPLE_RATE);
  const source = offlineCtx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(offlineCtx.destination);
  
  // Start from beginning, take up to targetDurationSec
  source.start(0, 0, actualDuration);
  
  const renderedBuffer = await offlineCtx.startRendering();
  return renderedBuffer.getChannelData(0);
}

// --- Upload Logic ---
elDropZone.addEventListener('click', () => elFileInput.click());
elDropZone.addEventListener('dragover', e => { e.preventDefault(); elDropZone.classList.add('dragover'); });
elDropZone.addEventListener('dragleave', () => elDropZone.classList.remove('dragover'));
elDropZone.addEventListener('drop', e => {
  e.preventDefault(); elDropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
elFileInput.addEventListener('change', e => {
  if (e.target.files.length) handleFile(e.target.files[0]);
});

async function handleFile(file) {
  if (!file.name.endsWith('.wav')) { showToast('Please upload a .wav file'); return; }
  elFileName.textContent = file.name;
  
  try {
    const arrayBuffer = await file.arrayBuffer();
    if(!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
    
    // Take up to 10s for uploaded file
    const float32Data = await resampleAudio(audioBuffer, 10.0);
    currentAudioPCM = floatTo16BitPCM(float32Data);
    drawWaveform(currentAudioPCM);
    
    elBtnClassifyUpload.disabled = false;
    elBtnClassifyRecord.style.display = 'none'; elBtnRecord.style.display = 'block'; // Reset record UI
  } catch(e) {
    showToast('Failed to read audio file');
    console.error(e);
  }
}

// --- Record Logic ---
let mediaStream = null;
let scriptProcessor = null;
let recordingTimeout = null;
let recordedChunks = [];
let recDuration = 5;
let isRecording = false;

elDurationBtns.forEach(btn => {
  btn.addEventListener('click', (e) => {
    if(isRecording) return;
    elDurationBtns.forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    recDuration = parseInt(e.target.dataset.dur);
  });
});

async function startRecording() {
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: TARGET_SAMPLE_RATE, channelCount: 1 } });
    if(!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioContext.createMediaStreamSource(mediaStream);
    scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);
    
    recordedChunks = [];
    isRecording = true;
    elBtnRecord.textContent = 'Stop Recording';
    elBtnRecord.classList.add('danger');
    elRecIndicator.classList.add('active');
    elBtnClassifyRecord.style.display = 'none';
    elBtnClassifyUpload.disabled = true; // disable upload classify
    
    scriptProcessor.onaudioprocess = (e) => {
      const inputData = e.inputBuffer.getChannelData(0);
      recordedChunks.push(new Float32Array(inputData));
      
      // Update meter
      let sum = 0;
      for (let i = 0; i < inputData.length; i++) sum += inputData[i] * inputData[i];
      let rms = Math.sqrt(sum / inputData.length);
      let vol = Math.min(100, rms * 1000);
      elRecMeter.style.width = vol + '%';
    };
    
    source.connect(scriptProcessor);
    scriptProcessor.connect(audioContext.destination);
    
    recordingTimeout = setTimeout(() => stopRecording(), recDuration * 1000);
  } catch(e) {
    showToast('Microphone access denied or error');
    console.error(e);
  }
}

function stopRecording() {
  if (!isRecording) return;
  isRecording = false;
  clearTimeout(recordingTimeout);
  
  if (scriptProcessor && mediaStream) {
    scriptProcessor.disconnect();
    mediaStream.getTracks().forEach(t => t.stop());
  }
  
  elBtnRecord.textContent = 'Start Recording';
  elBtnRecord.classList.remove('danger');
  elBtnRecord.style.display = 'none';
  elBtnClassifyRecord.style.display = 'block';
  elBtnClassifyRecord.disabled = false;
  elRecIndicator.classList.remove('active');
  elRecMeter.style.width = '0%';
  
  // Merge chunks
  const totalLength = recordedChunks.reduce((acc, chunk) => acc + chunk.length, 0);
  const merged = new Float32Array(totalLength);
  let offset = 0;
  for (const chunk of recordedChunks) {
    merged.set(chunk, offset);
    offset += chunk.length;
  }
  
  // Downsample to TARGET_SAMPLE_RATE if AudioContext didn't give us exactly 16kHz
  // Usually getUserMedia sampleRate constraint is a suggestion, so we might need offline context resampling.
  resampleAudioRecord(merged, audioContext.sampleRate).then(floatData => {
    currentAudioPCM = floatTo16BitPCM(floatData);
    drawWaveform(currentAudioPCM);
  });
}

async function resampleAudioRecord(floatData, origSampleRate) {
  if (origSampleRate === TARGET_SAMPLE_RATE) return floatData;
  const offlineCtx = new OfflineAudioContext(1, (floatData.length / origSampleRate) * TARGET_SAMPLE_RATE, TARGET_SAMPLE_RATE);
  const buffer = offlineCtx.createBuffer(1, floatData.length, origSampleRate);
  buffer.copyToChannel(floatData, 0);
  const source = offlineCtx.createBufferSource();
  source.buffer = buffer;
  source.connect(offlineCtx.destination);
  source.start(0);
  const rendered = await offlineCtx.startRendering();
  return rendered.getChannelData(0);
}

elBtnRecord.addEventListener('click', () => {
  if (isRecording) stopRecording();
  else startRecording();
});


// --- Classification ---
async function classifyAudio() {
  if (!currentAudioPCM) return;
  
  elResultsBox.classList.add('active');
  elResultContent.style.display = 'none';
  elSpinner.style.display = 'block';
  elResultsBox.scrollIntoView({ behavior: 'smooth' });
  
  const startTime = performance.now();
  
  try {
    const response = await fetch('/classify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream' },
      body: currentAudioPCM.buffer
    });
    
    if (!response.ok) throw new Error('Server returned ' + response.status);
    
    const res = await response.json();
    // expected: { top_class: "dog", confidence: 85, predictions: [{class:"dog", conf:85}, ...], inference_ms: 120, prep_ms: 5 }
    
    const prepTime = (performance.now() - startTime).toFixed(0);
    showResults(res, prepTime);
  } catch(e) {
    elSpinner.style.display = 'none';
    showToast('Classification failed: ' + e.message);
  }
}

function showResults(data, clientPrepTime) {
  elSpinner.style.display = 'none';
  elResultContent.style.display = 'block';
  
  const topClass = data.top_class || 'unknown';
  const conf = data.confidence || 0;
  
  document.getElementById('resEmoji').textContent = emojiMap[topClass] || '❓';
  document.getElementById('resClass').textContent = topClass.replace('_', ' ');
  
  const cat = categoryMap[topClass] || 'unknown';
  const elBadge = document.getElementById('resBadge');
  elBadge.textContent = cat.toUpperCase();
  elBadge.className = 'badge ' + cat;
  
  const elConfBar = document.getElementById('resConfBar');
  elConfBar.style.width = conf + '%';
  document.getElementById('resConfText').textContent = conf.toFixed(1) + '% Confidence';
  
  let color = 'var(--success)';
  if (conf < 40) color = 'var(--danger)';
  else if (conf < 70) color = 'var(--warning)';
  elConfBar.style.background = color;
  
  const elTop5 = document.getElementById('resTop5');
  elTop5.innerHTML = '';
  if (data.predictions) {
    data.predictions.slice(0,5).forEach(p => {
      elTop5.innerHTML += `
        <div class="pred-row">
          <div class="pred-name">${p.class.replace('_', ' ')}</div>
          <div class="pred-bar-bg"><div class="pred-bar" style="width:${p.conf}%"></div></div>
          <div class="pred-val">${p.conf.toFixed(0)}%</div>
        </div>
      `;
    });
  }
  
  document.getElementById('resInfTime').textContent = `⏱️ Inf: ${data.inference_ms || '--'} ms`;
  document.getElementById('resPrepTime').textContent = `⚙️ Prep: ${data.prep_ms || clientPrepTime} ms`;
}

elBtnClassifyUpload.addEventListener('click', classifyAudio);
elBtnClassifyRecord.addEventListener('click', classifyAudio);


// --- Status Update ---
async function fetchHealth() {
  try {
    const res = await fetch('/health');
    const data = await res.json();
    document.getElementById('connDot').className = 'status-dot connected';
    document.getElementById('connText').textContent = 'Connected to ESP32';
    document.getElementById('statHeap').textContent = `Heap: ${Math.round((data.free_heap||0)/1024)} KB`;
    
    const u = data.uptime || 0;
    const m = Math.floor(u / 60);
    const s = u % 60;
    document.getElementById('statUptime').textContent = `Uptime: ${m}m ${s}s`;
  } catch(e) {
    document.getElementById('connDot').className = 'status-dot disconnected';
    document.getElementById('connText').textContent = 'Disconnected';
  }
}
setInterval(fetchHealth, 30000);
fetchHealth(); // init

// Handle resizing canvas
window.addEventListener('resize', () => {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width - 32;
  canvas.height = 80;
  drawWaveform(currentAudioPCM);
});
// init canvas size
const rect = canvas.parentElement.getBoundingClientRect();
canvas.width = rect.width - 32;
canvas.height = 80;

</script>
</body>
</html>
