[env:arduino_nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
lib_deps =
    ESP Async WebServer
    AsyncTCP
    arduinoFFT
    https://github.com/tanakamasayuki/tfmicro.git
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DWEBSERVER_MAX_POST_ARG_LEN=65536
board_build.partitions = huge_app.csv
